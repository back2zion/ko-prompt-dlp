[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axfilter"
version = "0.1.0"
description = "Prompt PII/credential leak prevention for generative AI (detection, masking, policy, encrypted audit)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cryptography>=42",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
awskms = ["boto3>=1.34"]
sso = ["pyjwt[crypto]>=2.8"]
dev = ["pytest>=8", "httpx>=0.27", "alembic>=1.13"]

[project.scripts]
axfilter = "axfilter.cli:main"

[tool.setuptools]
packages = ["axfilter"]

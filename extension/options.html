<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AX필터 설정</title>
<style>
  body { font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a2233;
    background: #f5f7fb; margin: 0; padding: 28px; }
  .box { max-width: 440px; margin: 0 auto; background: #fff; border: 1px solid #e3e8f0;
    border-radius: 14px; padding: 22px; box-shadow: 0 8px 24px rgba(20,30,60,.06); }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: #6b7687; font-size: 12.5px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 5px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid #d7deea;
    border-radius: 9px; font: inherit; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .row label { margin: 0; font-weight: 400; }
  select { padding: 8px 10px; border: 1px solid #d7deea; border-radius: 9px; font: inherit; }
  button { margin-top: 20px; background: #3b5bdb; color: #fff; border: 0; border-radius: 9px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .status { margin-top: 12px; font-size: 12.5px; min-height: 18px; }
  .ok { color: #2f9e6f; } .bad { color: #e03131; }
  .note { margin-top: 16px; font-size: 12px; color: #6b7687; }
  .managed { margin: 14px 0 0; padding: 9px 11px; font-size: 12.5px; color: #8a5a00;
    background: #fff6e5; border: 1px solid #f0d089; border-radius: 9px; }
  input:disabled, select:disabled { background: #eef1f6; color: #6b7687; cursor: not-allowed; }
</style>
</head>
<body>
<div class="box">
  <h1>AX필터 설정</h1>
  <p class="sub">전송 전 프롬프트를 검사할 AX필터 서버를 지정합니다.</p>

  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled">검사 활성화</label>
  </div>

  <label for="apiBase">서버 주소</label>
  <input type="text" id="apiBase" placeholder="https://axfilter.example.com" />

  <label for="apiKey">에이전트 API 키</label>
  <input type="password" id="apiKey" placeholder="X-API-Key (agent)" />

  <label for="failMode">서버 연결 실패 시</label>
  <select id="failMode">
    <option value="block">전송 보류 (안전)</option>
    <option value="allow">그대로 전송</option>
  </select>

  <div class="managed" id="managed" hidden></div>

  <div><button id="save">저장 후 연결 확인</button></div>
  <div class="status" id="status"></div>
  <p class="note">키는 이 브라우저(chrome.storage)에만 저장됩니다. 조직 배포 시 정책으로 일괄 설정할 수 있습니다.</p>
</div>
<script src="options.js"></script>
</body>
</html>
